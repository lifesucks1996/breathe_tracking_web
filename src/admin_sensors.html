<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Sensores - Breathe Tracking</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/admin_sensors.css">
    
    <style>
        .admin-map-container { position: relative; height: 100%; width: 100%; }
        
        .map-controls-overlay {
            position: absolute;
            top: 20px;
            left: 60px; /* Ajustado para no tapar los controles de zoom */
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .map-controls-overlay select, 
        .map-controls-overlay input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .map-controls-overlay button {
            padding: 8px 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .map-controls-overlay button:hover { background: #34495e; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <img src="images/logo-breathe-tracking.png" alt="Breathe Tracking Logo">
        </div>
        
        <nav class="header-nav">
            <button id="btn-incidents" style="margin-right: 15px;" class="nav-button nav-button-ghost notification-btn" title="Ver Incidencias">
                <i class="fas fa-bell"></i>
                <span id="incident-badge" class="badge hidden"></span>
            </button>

            <a href="index.html" class="nav-button nav-button-ghost">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content-admin">
        <section class="admin-section sensors-list-section">
            <div class="section-header">
                <h2>Listado de Sensores</h2>
                
                <div class="filters-container" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    
                    <div class="filter-activity">
                        <label for="activityFilter">Estado</label>
                        <select id="activityFilter">
                            <option value="all">Todos</option>
                            <option value="incident">Con Incidencias</option>
                            <option value="inactive">Inactivos</option>
                        </select>
                    </div>

                    <div id="sort-inactive-container" class="filter-activity hidden" style="background-color: #fcebeb; border-color: #fab1b1;">
                        <label for="inactiveSort">Inactividad</label>
                        <select id="inactiveSort">
                            <option value="recent">Recientes primero</option>
                            <option value="old">Antiguos primero</option>
                        </select>
                    </div>

                </div>
            </div>
            
            <div id="sensors-container" class="sensors-container">
            </div>
        </section>

        <section class="admin-section sensor-map-section">
            <div class="section-header">
                <h2>Mapa General y Contaminación</h2>
            </div>
            
            <div class="admin-map-container">
                <div class="map-controls-overlay">
                    <input type="date" id="dateSelector" value="2025-12-01">

                    <select id="selectorContaminante">
                        <option value="GENERAL" style="font-weight:bold; color:#e74c3c;">Calidad General</option>
                        <option value="O3" selected>Ozono (O₃)</option>
                        <option value="NO2">Dióxido de Nitrógeno</option>
                        <option value="CO">Monóxido de Carbono</option>
                        <option value="SO2">Dióxido de Azufre</option>
                        <option value="CO2">Dióxido de Carbono</option>
                    </select>

                    <button id="btn-update-map">Actualizar Mapa</button>
                    
                    <span id="loading-indicator" style="display:none; color:#e74c3c; margin-left:5px;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </div>

                <div id="admin-map" class="admin-map"></div>
            </div>
        </section>
    </main>

    <div id="modal-incidents" class="modal-backdrop hidden">
        <div class="modal-panel">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-circle"></i> Gestión de Incidencias</h3>
                <button id="close-modal" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="pending">Pendientes <span id="count-pending">(0)</span></button>
                <button class="tab-btn" data-tab="resolved">Histórico</button>
            </div>

            <div class="modal-body">
                <div id="list-pending" class="incident-list active">
                    <p class="empty-msg">No hay incidencias pendientes.</p>
                </div>
                
                <div id="list-resolved" class="incident-list hidden">
                    <p class="empty-msg">No hay incidencias resueltas.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="js/users_map_data.js"></script>
    <script src="js/admin_sensors_data.js"></script>

    <script type="module" src="js/admin_sensors.js"></script>
</body>
</html>
