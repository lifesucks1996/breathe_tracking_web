<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Sensores - Breathe Tracking</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/admin_sensors.css"> 
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <img src="images/logo-breathe-tracking.png" alt="Breathe Tracking Logo">
        </div>
        
        <nav class="header-nav">
            <button id="btn-incidents" style="margin-right: 15px;" class="nav-button nav-button-ghost notification-btn" title="Ver Incidencias">
                <i class="fas fa-bell"></i>
                <span id="incident-badge" class="badge hidden"></span>
            </button>

            <a href="index.html" class="nav-button nav-button-ghost">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content-admin">
        <section class="admin-section sensors-list-section">
            <div class="section-header">
                <h2>Listado de Sensores</h2>
                <div class="filter-activity">
                    <label for="activityFilter">Actividad</label>
                    <select id="activityFilter">
                        <option value="all">Todos</option>
                        <option value="incident">Con Incidencias</option>
                        <option value="inactive">Inactivos</option>
                    </select>
                </div>
            </div>
            
            <div id="sensors-container" class="sensors-container">
                </div>
        </section>

        <section class="admin-section sensor-map-section">
            <div class="section-header">
                <h2>Mapa de Sensores</h2>
            </div>
            
            <div id="admin-map" class="admin-map"></div>
        </section>
    </main>

    <div id="modal-incidents" class="modal-backdrop hidden">
        <div class="modal-panel">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-circle"></i> Gestión de Incidencias</h3>
                <button id="close-modal" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="pending">Pendientes <span id="count-pending">(0)</span></button>
                <button class="tab-btn" data-tab="resolved">Histórico</button>
            </div>

            <div class="modal-body">
                <div id="list-pending" class="incident-list active">
                    <p class="empty-msg">No hay incidencias pendientes.</p>
                </div>
                
                <div id="list-resolved" class="incident-list hidden">
                    <p class="empty-msg">No hay incidencias resueltas.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/admin_sensors_data.js"></script>
    <script type="module" src="js/admin_sensors.js"></script>
</body>
</html>
