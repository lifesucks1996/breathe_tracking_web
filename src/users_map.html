<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Usuario - Breathe Tracking</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/users_map.css">
</head>

<body>
    <header class="main-header">
        <div class="logo">
            <img src="images/logo-breathe-tracking.png" alt="Breathe Tracking Logo">
        </div>
        <nav class="header-nav">
            <a href="../src/auth/usuarios.html" class="nav-icon"><i class="fas fa-user-circle"></i></a>
            <a href="index.html" class="nav-button nav-button-ghost">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-container">
        <div id="left-panel" class="left-panel">
            
            <div id="pin-list-view">
                <h3>Mis Puntos Guardados</h3>
                <div class="search-bar">
                    <input type="text" placeholder="Busca tus direcciones...">
                    <button><i class="fas fa-search"></i></button>
                </div>
                <div id="pins-container" class="pins-container"></div>
            </div>

            <div id="pin-detail-view" style="display: none;">
                <h3 id="detail-pin-title">Nombre del Lugar</h3>

                <div class="pin-detail-item">
                    <span>Dirección</span>
                    <p id="detail-direccion">C/...</p>
                </div>
                <div class="pin-detail-item">
                    <span>Última lectura</span>
                    <p id="detail-ultimas-mediciones">--:--</p>
                </div>

                <div class="slider-group">
                    <label>Nivel Actual</label>
                    <input type="range" id="ozono-slider" min="0" max="1" step="0.01" disabled>
                    <span id="ozono-value" style="font-weight: bold;">--</span>
                </div>

                <h4 class="activity-title">Gas: <span id="activity-contaminant-type">--</span></h4>
                
                <div class="detail-actions">
                    <button class="button-primary">Ver Ubicación</button>
                    <button id="delete-pin-btn" class="button-danger"><i class="fas fa-trash"></i> Eliminar</button>
                </div>

                <button class="back-to-list-button" onclick="window.mostrarListaPines()">← Volver a mis pines</button>
            </div>
        </div>

        <div id="map-panel" class="map-panel">
            <div id="loading-indicator" style="display:none; position:absolute; top:10px; right:10px; background:white; padding:10px; z-index:1000; border-radius:5px; box-shadow:0 0 5px rgba(0,0,0,0.2);">
                <i class="fas fa-spinner fa-spin"></i> Cargando datos...
            </div>

            <div class="map-controls-top">
                <input type="date" id="dateSelector" value="2025-12-01">
                
                <select id="selectorContaminante">
                    <option value="O3" selected>Ozono (O₃)</option>
                    <option value="NO2">Dióxido de Nitrógeno (NO₂)</option>
                    <option value="CO">Monóxido de Carbono (CO)</option>
                    <option value="SO2">Dióxido de Azufre (SO₂)</option>
                    <option value="CO2">Dióxido de Carbono (CO₂)</option>
                </select>

                <button class="button-primary" id="btn-update-map">Actualizar</button>
            </div>

            <div id="mapa"></div>

            <div id="name-pin-modal" class="modal-overlay" style="display: none;">
                <div class="modal-content">
                    <h3>Guardar Nueva Ubicación</h3>
                    <input type="text" id="new-pin-name-input" placeholder="Ej: Casa" autofocus>
                    <div class="modal-actions">
                        <button id="cancel-add-btn" class="button-secondary">Cancelar</button>
                        <button id="confirm-add-btn" class="button-primary">Guardar</button>
                    </div>
                </div>
            </div>

            <div class="map-controls-bottom">
                <button id="add-pin-btn" class="button-primary"><i class="fas fa-map-marker-alt"></i> Añadir Marcador</button>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="js/users_map_data.js"></script>
    <script src="js/users_map.js"></script>
</body>
</html>
