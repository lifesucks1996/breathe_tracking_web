<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Sensor - Breathe Tracking</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/admin_sensor_detail.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <img src="images/logo-breathe-tracking.png" alt="Breathe Tracking Logo">
        </div>
        
        <nav class="header-nav">
            <a href="admin_sensors.html" class="nav-button nav-button-ghost">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
            <a href="index.html" class="nav-button nav-button-ghost">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content-detail">

        <section class="sensor-info-panel">

            <h2 id="sensor-detail-title">Sensor...</h2>

            <div class="info-block block-location">
                <div class="location-header">
                    <h3>Ubicación Actual</h3>
                    <button class="button-danger compact-apagar">Apagar</button> 
                </div>
                
                <div class="status-row">
                    <p id="last-connection-info">--</p>
                    <p id="battery-status-text">--</p>
                </div>
                
                <div class="address-row">
                    <p class="location-text main-location" id="current-location">--</p>
                    <p class="location-text avg-location" id="avg-location">--</p>
                </div>
            </div>

            <div class="info-block block-point-4">
                <div class="point-header">
                    <h3>Mediciones Actuales</h3>
                    <span class="point-time" id="point-time">--:--</span>
                </div>

                <p class="point-location" id="point-location-text">--</p>
            
                <div class="pollutants-list">
                    
                    <div class="pollutant-row">
                        <span class="pollutant-label">PM2.5</span>
                        <div class="progress-bg">
                            <div class="progress-fill fill-green" style="width: 25%;"></div>
                        </div>
                        <span class="pollutant-value">12 µg/m³</span>
                    </div>

                    <div class="pollutant-row">
                        <span class="pollutant-label">PM10</span>
                        <div class="progress-bg">
                            <div class="progress-fill fill-green" style="width: 35%;"></div>
                        </div>
                        <span class="pollutant-value">25 µg/m³</span>
                    </div>

                    <div class="pollutant-row">
                        <span class="pollutant-label">NO2</span>
                        <div class="progress-bg">
                            <div class="progress-fill fill-yellow" style="width: 55%;"></div>
                        </div>
                        <span class="pollutant-value">40 µg/m³</span>
                    </div>

                    <div class="pollutant-row">
                        <span class="pollutant-label">SO2</span>
                        <div class="progress-bg">
                            <div class="progress-fill fill-green" style="width: 10%;"></div>
                        </div>
                        <span class="pollutant-value">5 µg/m³</span>
                    </div>

                    <div class="pollutant-row">
                        <span class="pollutant-label">Ozono</span>
                        <div class="progress-bg">
                            <div class="progress-fill fill-green" style="width: 20%;"></div>
                        </div>
                        <span class="pollutant-value">0.3 ppm</span>
                    </div>

                </div>
            </div>

            <div class="info-block activity-block">
                <h3>Actividad</h3>

                <select id="activity-contaminant-select">
                    <option value="Ozono">Ozono</option>
                    <option value="PM25">PM2.5</option>
                    <option value="PM10">PM10</option>
                    <option value="NO2">NO2</option>
                    <option value="SO2">SO2</option>
                </select>

                <div class="chart-placeholder">
                    <p style="margin:0; font-size: 0.8em; color:#999;">Histórico de Lecturas</p>
                </div>
                
                </div>

        </section>

        <section class="sensor-map-panel">
            <div class="section-header-map">
                <h2>Mapa del Sensor</h2>
                <div class="filter-controls">
                    <div class="date-time-group">
                        <input type="date" value="2025-10-01">
                        <input type="time" value="00:00">
                        <input type="time" value="23:59">
                    </div>
                    <button class="button-primary">Punto Actual</button>
                    <button class="button-primary">Buscar</button>
                </div>
            </div>
            
            <div id="detail-map" class="detail-map"></div>
            <button class="button-primary change-pin-button">Cambiar Pin</button>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/admin_sensors_data.js"></script>
    <script src="js/admin_sensor_detail.js"></script>

</body>
</html>
